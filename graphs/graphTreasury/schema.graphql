type Transaction @entity {
  id: ID!
  timestamp: BigInt!
  blockNumber: BigInt!
  blockHash: Bytes!
  from: Bytes!
  to: Bytes
  value: BigInt!
  gasPrice: BigInt!
}

type OwnershipTransferred @entity {
  id: ID!
  transaction: Transaction!
  previousOwner: Bytes!
  newOwner: Bytes!
}

type UpdatedPermission @entity {
  id: ID!
  transaction: Transaction!
  contractAddress: Bytes!
  state: Boolean!
}

type UpdatedReservedToken @entity {
  id: ID!
  transaction: Transaction!
  token: Bytes!
  state: Boolean!
}

type Rate @entity {
  id: ID!
  transaction: Transaction!
  rate: BigInt!
  reserves: BigInt!
  totalValueLocked: BigInt!
  stabl3CirculatingSupply: BigInt!
  timestamp: BigInt!
}

type UpdatedROI @entity {
  id: ID!
  transaction: Transaction!
  newROI: Bytes!
  oldROI: Bytes!
}

type UpdatedHQ @entity {
  id: ID!
  transaction: Transaction!
  newHQ: Bytes!
  oldHQ: Bytes!
}