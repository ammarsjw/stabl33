specVersion: 0.0.4
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: Treasury
    network: mumbai
    source:
      address: "0xB10C07F1b6e8355406271c72405Df826a01862c1"
      abi: Treasury
      startBlock: 34285984
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Rate
        - UpdatedExchangeFee
        - UpdatedReservedToken
      abis:
        - name: Treasury
          file: Treasury\abis\Treasury.json
      eventHandlers:
        - event: Rate(uint256,uint256,uint256,uint256,uint256)
          handler: handleRate
        - event: UpdatedExchangeFee(uint256,uint256)
          handler: handleUpdatedExchangeFee
        - event: UpdatedReservedToken(address,bool)
          handler: handleUpdatedReservedToken
      file: Treasury\Treasury.wasm
  - kind: ethereum
    name: ROI
    network: mumbai
    source:
      address: "0x8969eD30d831D5BECefe9A94327a054A2941848A"
      abi: ROI
      startBlock: 34285990
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - APR
      abis:
        - name: ROI
          file: ROI\abis\ROI.json
      eventHandlers:
        - event: APR(uint256,uint256,uint256,uint256)
          handler: handleAPR
      file: ROI\ROI.wasm
  - kind: ethereum
    name: Stabl3Staking
    network: mumbai
    source:
      address: "0x226db9b7A7F97D52845EE90E77bD02B4c12F3F14"
      abi: Stabl3Staking
      startBlock: 34285999
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - ClaimedLendingStabl3
        - Stake
        - Unstake
        - WithdrewReward
      abis:
        - name: Stabl3Staking
          file: Stabl3Staking\abis\Stabl3Staking.json
      eventHandlers:
        - event: ClaimedLendingStabl3(indexed address,uint256,address,uint256,uint256,uint256)
          handler: handleClaimedLendingStabl3
        - event: Stake(indexed
            address,uint256,bool,uint8,address,uint256,uint256,uint256,bool,uint256,uint256)
          handler: handleStake
        - event: Unstake(indexed address,uint256,address,uint256,uint256,uint8,bool)
          handler: handleUnstake
        - event: WithdrewReward(indexed address,uint256,address,uint256,uint256,bool,uint256)
          handler: handleWithdrewReward
      file: Stabl3Staking\Stabl3Staking.wasm
  - kind: ethereum
    name: Stabl3Borrowing
    network: mumbai
    source:
      address: "0xE1Fc546110563f95Ab4B69a14aF32E83318258FE"
      abi: Stabl3Borrowing
      startBlock: 34286003
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Borrow
        - Payback
        - ExchangeUCD
      abis:
        - name: Stabl3Borrowing
          file: Stabl3Borrowing\abis\Stabl3Borrowing.json
      eventHandlers:
        - event: Borrow(indexed address,uint256,uint256,uint256,uint256)
          handler: handleBorrow
        - event: Payback(indexed address,uint256,uint256,uint256,uint256)
          handler: handlePayback
        - event: ExchangeUCD(indexed address,address,uint256,uint256,uint256,uint256)
          handler: handleExchangeUCD
      file: Stabl3Borrowing\Stabl3Borrowing.wasm
  - kind: ethereum
    name: Stabl3Bonding
    network: mumbai
    source:
      address: "0xFdAA3a5C4C279D3E77a99Ae7f5FA873bfa999d2f"
      abi: Stabl3Bonding
      startBlock: 34286007
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - CreatedBond
        - Bond
        - ClaimedBond
      abis:
        - name: Stabl3Bonding
          file: Stabl3Bonding\abis\Stabl3Bonding.json
      eventHandlers:
        - event: CreatedBond(uint256,uint256,uint256,uint256,uint256)
          handler: handleCreatedBond
        - event: Bond(indexed
            address,uint256,uint256,uint256,address,uint256,uint256,uint256,uint256)
          handler: handleBond
        - event: ClaimedBond(indexed
            address,uint256,uint256,uint256,address,uint256,uint256,uint256,uint256)
          handler: handleClaimedBond
      file: Stabl3Bonding\Stabl3Bonding.wasm
