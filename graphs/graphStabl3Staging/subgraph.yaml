specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Treasury
    network: mumbai
    source:
      address: "0x1B43AC6D6268DaF49A087904D16e5C1892d339F9"
      abi: Treasury
      startBlock: 33806015
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Rate
        - UpdatedExchangeFee
        - UpdatedReservedToken
      abis:
        - name: Treasury
          file: ./abis/Treasury.json
      eventHandlers:
        - event: Rate(uint256,uint256,uint256,uint256,uint256)
          handler: handleRate
        - event: UpdatedExchangeFee(uint256,uint256)
          handler: handleUpdatedExchangeFee
        - event: UpdatedReservedToken(address,bool)
          handler: handleUpdatedReservedToken
      file: ./src/treasury.ts
  - kind: ethereum
    name: ROI
    network: mumbai
    source:
      address: "0xD53F0b03afC3d8Ad556BA3920bB30436bFF7B562"
      abi: ROI
      startBlock: 33806020
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - APR
      abis:
        - name: ROI
          file: ./abis/ROI.json
      eventHandlers:
        - event: APR(uint256,uint256,uint256,uint256)
          handler: handleAPR
      file: ./src/roi.ts
  - kind: ethereum
    name: Stabl3Staking
    network: mumbai
    source:
      address: "0x52e7f0C4E3377e688A2C0841A8c6C95b6eA31FC6"
      abi: Stabl3Staking
      startBlock: 33806028
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - ClaimedLendingStabl3
        - Stake
        - Unstake
        - WithdrewReward
      abis:
        - name: Stabl3Staking
          file: ./abis/Stabl3Staking.json
      eventHandlers:
        - event: ClaimedLendingStabl3(indexed address,uint256,address,uint256,uint256,uint256)
          handler: handleClaimedLendingStabl3
        - event: Stake(indexed address,uint256,bool,uint8,address,uint256,uint256,uint256,bool,uint256,uint256)
          handler: handleStake
        - event: Unstake(indexed address,uint256,address,uint256,uint256,uint8,bool)
          handler: handleUnstake
        - event: WithdrewReward(indexed address,uint256,address,uint256,uint256,bool,uint256)
          handler: handleWithdrewReward
      file: ./src/stabl-3-staking.ts
  - kind: ethereum
    name: Stabl3Borrowing
    network: mumbai
    source:
      address: "0x7f157b91177537990F1a55AcE071A4B6fb4c6711"
      abi: Stabl3Borrowing
      startBlock: 33806032
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Borrow
        - Payback
        - ExchangeUCD
      abis:
        - name: Stabl3Borrowing
          file: ./abis/Stabl3Borrowing.json
      eventHandlers:
        - event: Borrow(indexed address,uint256,uint256,uint256,uint256)
          handler: handleBorrow
        - event: Payback(indexed address,uint256,uint256,uint256,uint256)
          handler: handlePayback
        - event: ExchangeUCD(indexed address,address,uint256,uint256,uint256,uint256)
          handler: handleExchangeUCD
      file: ./src/stabl-3-borrowing.ts
  - kind: ethereum
    name: Stabl3Bonding
    network: mumbai
    source:
      address: "0x7A117DA92DE700311C37Aa595826E9205909870a"
      abi: Stabl3Bonding
      startBlock: 33806035
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - CreatedBond
        - Bond
        - ClaimedBond
      abis:
        - name: Stabl3Bonding
          file: ./abis/Stabl3Bonding.json
      eventHandlers:
        - event: CreatedBond(uint256,uint256,uint256,uint256,uint256)
          handler: handleCreatedBond
        - event: Bond(indexed address,uint256,uint256,uint256,address,uint256,uint256,uint256,uint256)
          handler: handleBond
        - event: ClaimedBond(indexed address,uint256,uint256,uint256,address,uint256,uint256,uint256,uint256)
          handler: handleClaimedBond
      file: ./src/stabl-3-bonding.ts