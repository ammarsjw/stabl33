specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Treasury
    network: fantom-testnet
    source:
      address: "0xCE4f5275Af3280AefD5aCF244cF9453336FF7e01"
      abi: Treasury
      startBlock: 12068513
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Rate
        - UpdatedExchangeFee
        - UpdatedReservedToken
      abis:
        - name: Treasury
          file: ./abis/Treasury.json
      eventHandlers:
        - event: Rate(uint256,uint256,uint256,uint256,uint256)
          handler: handleRate
        - event: UpdatedExchangeFee(uint256,uint256)
          handler: handleUpdatedExchangeFee
        - event: UpdatedReservedToken(address,bool)
          handler: handleUpdatedReservedToken
      file: ./src/treasury.ts
  - kind: ethereum
    name: ROI
    network: fantom-testnet
    source:
      address: "0x5008d6e33ea5134f5feb3823a4ff7e8f86311bb0"
      abi: ROI
      startBlock: 12068521
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - APR
      abis:
        - name: ROI
          file: ./abis/ROI.json
      eventHandlers:
        - event: APR(uint256,uint256,uint256,uint256)
          handler: handleAPR
      file: ./src/roi.ts
  - kind: ethereum
    name: Stabl3Staking
    network: fantom-testnet
    source:
      address: "0xed3c83b4cea3a03b9f6b4cf1d18adddfa808a05e"
      abi: Stabl3Staking
      startBlock: 12068547
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - ClaimedLendingStabl3
        - Stake
        - Unstake
        - WithdrewReward
      abis:
        - name: Stabl3Staking
          file: ./abis/Stabl3Staking.json
      eventHandlers:
        - event: ClaimedLendingStabl3(indexed address,uint256,address,uint256,uint256,uint256)
          handler: handleClaimedLendingStabl3
        - event: Stake(indexed address,uint256,bool,uint8,address,uint256,uint256,uint256,bool,uint256,uint256)
          handler: handleStake
        - event: Unstake(indexed address,uint256,address,uint256,uint256,uint8,bool)
          handler: handleUnstake
        - event: WithdrewReward(indexed address,uint256,address,uint256,uint256,bool,uint256)
          handler: handleWithdrewReward
      file: ./src/stabl-3-staking.ts