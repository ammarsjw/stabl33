specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Treasury
    network: mumbai
    source:
      address: "0x589d1038b6d0bF9C0087F5DEC265C68BBAb22569"
      abi: Treasury
      startBlock: 29923311
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Rate
        - UpdatedExchangeFee
        - UpdatedReservedToken
      abis:
        - name: Treasury
          file: ./abis/Treasury.json
      eventHandlers:
        - event: Rate(uint256,uint256,uint256,uint256,uint256)
          handler: handleRate
        - event: UpdatedExchangeFee(uint256,uint256)
          handler: handleUpdatedExchangeFee
        - event: UpdatedReservedToken(address,bool)
          handler: handleUpdatedReservedToken
      file: ./src/treasury.ts
  - kind: ethereum
    name: ROI
    network: mumbai
    source:
      address: "0x492DA635746AB09280674Ac16F077540e930E33C"
      abi: ROI
      startBlock: 29923347
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - APR
      abis:
        - name: ROI
          file: ./abis/ROI.json
      eventHandlers:
        - event: APR(uint256,uint256,uint256,uint256)
          handler: handleAPR
      file: ./src/roi.ts
  - kind: ethereum
    name: Stabl3Staking
    network: mumbai
    source:
      address: "0x2AB665F9753937E16AB9002c3e1F48a60F70D22E"
      abi: Stabl3Staking
      startBlock: 29925925
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - ClaimedLendingStabl3
        - Stake
        - Unstake
        - WithdrewReward
      abis:
        - name: Stabl3Staking
          file: ./abis/Stabl3Staking.json
      eventHandlers:
        - event: ClaimedLendingStabl3(indexed address,uint256,address,uint256,uint256,uint256)
          handler: handleClaimedLendingStabl3
        - event: Stake(indexed address,uint256,bool,uint8,address,uint256,uint256,uint256,bool,uint256,uint256)
          handler: handleStake
        - event: Unstake(indexed address,uint256,address,uint256,uint256,uint8,bool)
          handler: handleUnstake
        - event: WithdrewReward(indexed address,uint256,address,uint256,uint256,bool,uint256)
          handler: handleWithdrewReward
      file: ./src/stabl-3-staking.ts
  - kind: ethereum
    name: Stabl3Borrowing
    network: mumbai
    source:
      address: "0x72B9313BC716b079ba46d127b872356e9F94741c"
      abi: Stabl3Borrowing
      startBlock: 29925266
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - Borrow
        - Payback
        - ExchangeUCD
      abis:
        - name: Stabl3Borrowing
          file: ./abis/Stabl3Borrowing.json
      eventHandlers:
        - event: Borrow(indexed address,uint256,uint256,uint256,uint256)
          handler: handleBorrow
        - event: Payback(indexed address,uint256,uint256,uint256,uint256)
          handler: handlePayback
        - event: ExchangeUCD(indexed address,address,uint256,uint256,uint256,uint256)
          handler: handleExchangeUCD
      file: ./src/stabl-3-borrowing.ts
  - kind: ethereum
    name: Stabl3Bonding
    network: mumbai
    source:
      address: "0x772aD477f5B94b09F68d31Eb40285E217D88934c"
      abi: Stabl3Bonding
      startBlock: 29925332
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - CreatedBond
        - Bond
        - ClaimedBond
      abis:
        - name: Stabl3Bonding
          file: ./abis/Stabl3Bonding.json
      eventHandlers:
        - event: CreatedBond(uint256,uint256,uint256,uint256,uint256)
          handler: handleCreatedBond
        - event: Bond(indexed address,uint256,uint256,uint256,address,uint256,uint256,uint256)
          handler: handleBond
        - event: ClaimedBond(indexed address,uint256,uint256,uint256,address,uint256,uint256,uint256)
          handler: handleClaimedBond
      file: ./src/stabl-3-bonding.ts