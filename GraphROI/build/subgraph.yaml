specVersion: 0.0.4
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: ROI
    network: goerli
    source:
      address: "0xbe1d0dB61E7562d88eF1FAb7436d02b6d00ce728"
      abi: ROI
      startBlock: 7825564
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - APR
        - OwnershipTransferred
        - UpdatedPermission
        - UpdatedTreasury
      abis:
        - name: ROI
          file: ROI\abis\ROI.json
      eventHandlers:
        - event: APR(uint256,uint256,uint256,uint256)
          handler: handleAPR
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: UpdatedPermission(address,bool)
          handler: handleUpdatedPermission
        - event: UpdatedTreasury(address,address)
          handler: handleUpdatedTreasury
      file: ROI\ROI.wasm
