specVersion: 0.0.4
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: ROI
    network: goerli
    source:
      address: "0xeD3C83b4ceA3A03b9F6B4Cf1d18AddDFa808a05E"
      abi: ROI
      startBlock: 7680059
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - APR
        - OwnershipTransferred
        - UpdatedPermission
        - UpdatedTreasury
      abis:
        - name: ROI
          file: ROI\abis\ROI.json
      eventHandlers:
        - event: APR(uint256,uint256,uint256,uint256)
          handler: handleAPR
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: UpdatedPermission(address,bool)
          handler: handleUpdatedPermission
        - event: UpdatedTreasury(address,address)
          handler: handleUpdatedTreasury
      file: ROI\ROI.wasm
