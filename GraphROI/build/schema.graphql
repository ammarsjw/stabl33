type Transaction @entity {
  id: ID!
  timestamp: BigInt!
  blockNumber: BigInt!
  blockHash: Bytes!
  from: Bytes!
  to: Bytes
  value: BigInt!
  gasPrice: BigInt!
}

type OwnershipTransferred @entity {
  id: ID!
  transaction: Transaction!
  previousOwner: Bytes!
  newOwner: Bytes!
}

type UpdatedTreasury @entity {
  id: ID!
  transaction: Transaction!
  newTreasury: Bytes!
  oldTreasury: Bytes!
}

type UpdatedPermission @entity {
  id: ID!
  transaction: Transaction!
  contractAddress: Bytes!
  state: Boolean!
}

type APR @entity {
  id: ID!
  transaction: Transaction!
  APR: BigInt!
  reserves: BigInt!
  totalRewardDistributed: BigInt!
  blockTimestampLast: BigInt!
}