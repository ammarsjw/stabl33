specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ROI
    network: fantom-testnet
    source:
      address: "0x56a684123ac62d56b35e5c98615a6a6608f73c87"
      abi: ROI
      startBlock: 11456576
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - APR
        - OwnershipTransferred
        - UpdatedPermission
        - UpdatedTreasury
      abis:
        - name: ROI
          file: ./abis/ROI.json
      eventHandlers:
        - event: APR(uint256,uint256,uint256,uint256)
          handler: handleAPR
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: UpdatedPermission(address,bool)
          handler: handleUpdatedPermission
        - event: UpdatedTreasury(address,address)
          handler: handleUpdatedTreasury
      file: ./src/roi.ts
