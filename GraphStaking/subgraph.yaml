specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Stabl3Staking
    network: goerli
    source:
      address: "0x794a209a187ecdc53814845116e7006894a0e78a"
      abi: Stabl3Staking
      startBlock: 7835846
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - ClaimedLendingStabl3
        - OwnershipTransferred
        - Stake
        - Unstake
        - UpdatedHQ
        - UpdatedROI
        - UpdatedTreasury
        - WithdrewReward
      abis:
        - name: Stabl3Staking
          file: ./abis/Stabl3Staking.json
      eventHandlers:
        - event: ClaimedLendingStabl3(indexed address,uint256,address,uint256,uint256,uint256)
          handler: handleClaimedLendingStabl3
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Stake(indexed address,uint256,bool,uint8,address,uint256,uint256,uint256,bool,uint256)
          handler: handleStake
        - event: Unstake(indexed address,uint256,address,uint256,uint256,uint8,bool)
          handler: handleUnstake
        - event: UpdatedHQ(address,address)
          handler: handleUpdatedHQ
        - event: UpdatedROI(address,address)
          handler: handleUpdatedROI
        - event: UpdatedTreasury(address,address)
          handler: handleUpdatedTreasury
        - event: WithdrewReward(indexed address,uint256,address,uint256,uint256,bool,uint256)
          handler: handleWithdrewReward
      file: ./src/stabl-3-staking.ts
