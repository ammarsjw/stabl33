specVersion: 0.0.4
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: Stabl3Staking
    network: goerli
    source:
      address: "0x353984031DA92725253B6301526a4a8F7FEB27c4"
      abi: Stabl3Staking
      startBlock: 7684861
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - ClaimedLendingStabl3
        - OwnershipTransferred
        - Stake
        - Unstake
        - UpdatedHQ
        - UpdatedLendingStabl3ClaimTime
        - UpdatedLendingStabl3Percentage
        - UpdatedLockTime
        - UpdatedPermission
        - UpdatedROI
        - UpdatedTreasury
        - UpdatedUnstakeFeePercentage
        - WithdrewReward
      abis:
        - name: Stabl3Staking
          file: Stabl3Staking\abis\Stabl3Staking.json
      eventHandlers:
        - event: ClaimedLendingStabl3(indexed
            address,uint256,address,uint256,uint256,uint256,uint256)
          handler: handleClaimedLendingStabl3
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Stake(indexed address,uint256,uint8,address,uint256,uint256,bool,uint256)
          handler: handleStake
        - event: Unstake(indexed address,uint256,address,uint256,uint256,uint8,bool)
          handler: handleUnstake
        - event: UpdatedHQ(address,address)
          handler: handleUpdatedHQ
        - event: UpdatedLendingStabl3ClaimTime(uint256,uint256)
          handler: handleUpdatedLendingStabl3ClaimTime
        - event: UpdatedLendingStabl3Percentage(uint256,uint256)
          handler: handleUpdatedLendingStabl3Percentage
        - event: UpdatedLockTime(uint256[4],uint256[4])
          handler: handleUpdatedLockTime
        - event: UpdatedPermission(address,bool)
          handler: handleUpdatedPermission
        - event: UpdatedROI(address,address)
          handler: handleUpdatedROI
        - event: UpdatedTreasury(address,address)
          handler: handleUpdatedTreasury
        - event: UpdatedUnstakeFeePercentage(uint256,uint256)
          handler: handleUpdatedUnstakeFeePercentage
        - event: WithdrewReward(indexed address,uint256,address,uint256,uint256,bool,uint256)
          handler: handleWithdrewReward
      file: Stabl3Staking\Stabl3Staking.wasm
