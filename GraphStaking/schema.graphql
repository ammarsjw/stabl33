type Transaction @entity {
  id: ID!
  timestamp: BigInt!
  blockNumber: BigInt!
  blockHash: Bytes!
  from: Bytes!
  to: Bytes
  value: BigInt!
  gasPrice: BigInt!
}

type OwnershipTransferred @entity {
  id: ID!
  transaction: Transaction!
  previousOwner: Bytes!
  newOwner: Bytes!
}

type UpdatedTreasury @entity {
  id: ID!
  transaction: Transaction!
  newTreasury: Bytes
  oldTreasury: Bytes
}

type UpdatedROI @entity {
  id: ID!
  transaction: Transaction!
  newROI: Bytes
  oldROI: Bytes
}

type UpdatedHQ @entity {
  id: ID!
  transaction: Transaction!
  newHQ: Bytes
  oldHQ: Bytes
}

type Stake @entity {
  id: ID!
  transaction: Transaction!
  user: Bytes
  index: BigInt
  status: Boolean
  stakingType: Int
  token: Bytes
  amountToken: BigInt
  totalAmountToken: BigInt
  endTime: BigInt
  isLend: Boolean
  timestamp: BigInt
}

type WithdrewReward @entity {
  id: ID!
  transaction: Transaction!
  user: Bytes
  index: BigInt
  token: Bytes
  rewardWithdrawn: BigInt
  totalRewardWithdrawn: BigInt
  isLend: Boolean
  timestamp: BigInt
}

type ClaimedLendingStabl3 @entity {
  id: ID!
  transaction: Transaction!
  user: Bytes
  index: BigInt
  token: Bytes
  amountTokenLending: BigInt
  amountStabl3Lending: BigInt
  totalAmountStabl3Withdrawn: BigInt
  timestamp: BigInt
}

type Unstake @entity {
  id: ID!
  transaction: Transaction!
  user: Bytes
  index: BigInt
  token: Bytes
  amountToken: BigInt
  reward: BigInt
  stakingType: Int
  isLend: Boolean
}