specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Treasury
    network: goerli
    source:
      address: "0xfe5489598e255a25B2E22aE10cc92EDDd1ed9265"
      abi: Treasury
      startBlock: 7685327
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - OwnershipTransferred
        - Rate
        - UpdatedPermission
        - UpdatedReservedToken
        - UpdatedROI
        - UpdatedHQ
      abis:
        - name: Treasury
          file: ./abis/Treasury.json
      eventHandlers:
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Rate(uint256,uint256,uint256,uint256,uint256)
          handler: handleRate
        - event: UpdatedPermission(address,bool)
          handler: handleUpdatedPermission
        - event: UpdatedReservedToken(address,bool)
          handler: handleUpdatedReservedToken
        - event: UpdatedROI(address,address)
          handler: handleUpdatedROI
        - event: UpdatedHQ(address,address)
          handler: handleUpdatedHQ
      file: ./src/mapping.ts