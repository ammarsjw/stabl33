specVersion: 0.0.4
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: Treasury
    network: goerli
    source:
      address: "0x6e36ed03dF3318b183c50c0D0fB30ba530f6F183"
      abi: Treasury
      startBlock: 7464039
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      entities:
        - OwnershipTransferred
        - Rate
        - UpdatedPermission
        - UpdatedReservedToken
      abis:
        - name: Treasury
          file: Treasury\abis\Treasury.json
      eventHandlers:
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Rate(uint256,uint256)
          handler: handleRate
        - event: UpdatedPermission(address,bool)
          handler: handleUpdatedPermission
        - event: UpdatedReservedToken(address,bool)
          handler: handleUpdatedReservedToken
      file: Treasury\Treasury.wasm
